name: Generate Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build
        # Note: Building without base path for screenshots

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve built app
        run: |
          npx vite preview --port 3000 --host &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "Waiting for Vite preview server to start..."
          sleep 10

          # Check if server is responding
          for i in {1..10}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              break
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done

          # Verify server is actually running
          curl -I http://localhost:3000 || (echo "❌ Server not responding" && exit 1)
          echo "🌐 Testing base path..."
          curl -I http://localhost:3000/adk-session-reader/ || echo "⚠️  Base path not found (might be OK for preview)"

      - name: Take screenshots
        run: npx tsx scripts/take-screenshots.ts

      - name: Debug on failure
        if: failure()
        run: |
          echo "📋 Checking if server is still running..."
          curl -I http://localhost:3000 || echo "Server is not running"
          echo "📁 Listing dist directory..."
          ls -la dist/
          echo "📁 Checking screenshots directory..."
          ls -la screenshots/ || echo "No screenshots directory"

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Commit screenshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add screenshots/
          git diff --staged --quiet || git commit -m "docs: update screenshots [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
